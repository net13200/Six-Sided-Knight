# Typecheck, lint, format, unit tests, build, and browser tests on every push and PR.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate-levels
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The Poki build: checked the same way, and its zip kept for upload.
      - run: npm run build:poki
      - run: npm run size -- dist-poki
      - run: npm run test:e2e:poki
      - uses: actions/upload-artifact@v4
        with:
          name: six-sided-knight-poki
          path: six-sided-knight-poki.zip
      # The CrazyGames build (Basic Launch: no SDK), likewise.
      - run: npm run build:crazygames
      - run: npm run size -- dist-crazygames
      - run: npm run test:e2e:crazygames
      - uses: actions/upload-artifact@v4
        with:
          name: six-sided-knight-crazygames
          path: six-sided-knight-crazygames.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
